# OWASP ZAP baseline (passive scan): rules of tests/security/zap/run-baseline.sh.
# Format: <rule id><TAB>IGNORE|WARN|FAIL<TAB>(comment). Rules that are not listed behave as WARN.
# Owner's criterion (03.11.2026): no High alert; every Medium is fixed or recorded with a reason (STAGING_PHASE2_CHECKLIST.md 7.2).
# High is checked by check_reports.py on the JSON reports regardless of this file; FAIL here is only for rules whose
# absence is a defect of our own configuration (headers/cookies we set ourselves), so one such alert stops the run (exit 1).

# --- FAIL: our own hardening that the checklist (7.2) and docs/07 section 14 demand ---
10035	FAIL	(Strict-Transport-Security Header Not Set) HSTS is expected on every HTTPS page of staging/production
10011	FAIL	(Cookie Without Secure Flag) session/2FA cookies of the panels must be Secure on HTTPS
10021	FAIL	(X-Content-Type-Options Header Missing) nosniff is set globally by nginx
10037	FAIL	(Server Leaks Information via X-Powered-By) PHP/framework version must not be exposed
10036	FAIL	(HTTP Server Response Header) the nginx version must not be exposed (server_tokens off)

# --- WARN: review each one, fix or record the reason in the checklist journal ---
10010	WARN	(Cookie No HttpOnly Flag) XSRF-TOKEN is readable by JS by design (Laravel/Livewire); anything else is a defect
10054	WARN	(Cookie without SameSite Attribute)
10020	WARN	(Missing Anti-clickjacking Header) must be absent only where a frame is intended
10038	WARN	(Content Security Policy Header Not Set) /admin/login and the static pages must have CSP (StaticPageCsp)
10055	WARN	(CSP: unsafe-inline / wildcard / missing directives) Filament and Livewire need unsafe-inline/eval in the panels: record, do not ignore
10063	WARN	(Permissions Policy Header Not Set)
10015	WARN	(Re-examine Cache-control Directives) /billing/return must be no-store
10003	WARN	(Vulnerable JS Library) run npm audit in resources/twa as well
10098	WARN	(Cross-Domain Misconfiguration) CORS: the API is called from the TWA of the same origin
10202	WARN	(Absence of Anti-CSRF Tokens) Livewire forms carry their own token; check manually before closing

# --- IGNORE: noise of this stack, with the reason ---
10049	IGNORE	(Storable and Cacheable Content) public pages and TWA assets are meant to be cached
10096	IGNORE	(Timestamp Disclosure - Unix) numbers in the minified TWA/Filament bundles look like timestamps
10027	IGNORE	(Information Disclosure - Suspicious Comments) words like "select"/"todo" in vendor bundles
10109	IGNORE	(Modern Web Application) informational: the TWA is an SPA
90005	IGNORE	(Sec-Fetch-* Header Missing) the scanner request, not the application
10094	IGNORE	(Base64 Disclosure) Livewire snapshots and Vite assets carry base64 on purpose
