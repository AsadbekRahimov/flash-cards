; php-fpm pool of the production app image (Dockerfile, stage app). Loaded after the image's own
; zz-docker.conf (alphabetical order), so these values win over the image default pm.max_children = 5.
; php-fpm substitutes ${VAR} from the environment; Dockerfile sets the defaults (ENV), and the container
; environment (compose `env_file: .env`) overrides them. Sizing: docs/DEVOPS_GUIDE.md "Пул php-fpm".
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
