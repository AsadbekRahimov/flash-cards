; php-fpm pool of the production app image (Dockerfile, stage app). Loaded after the image's own
; zz-docker.conf (alphabetical order), so these values win over the image default pm.max_children = 5.
; php-fpm substitutes ${VAR} from the environment; Dockerfile sets the defaults (ENV), and the container
; environment (compose `env_file: .env`) overrides them. Sizing: docs/DEVOPS_GUIDE.md "Пул php-fpm".
[www]
; The workers must see the container environment (APP_SURFACE of App\Support\Surface decides the providers and routes
; of a process; the pool values below come from it too). The official image already sets this in docker.conf; pinned
; here so a change of the base image cannot silently hand every worker an empty environment.
clear_env = no
; PHP_FPM_PM: dynamic (the image default, the full surface: panels, webhooks) or static (the app-api container of docker-compose.prod.yml:
; a steady learner load wants every worker ready, spawn/kill of dynamic pm costs latency; start/spare values are then unused).
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
