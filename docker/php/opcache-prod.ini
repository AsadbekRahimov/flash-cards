; OPcache of the PRODUCTION image only (stage `app` of the Dockerfile; Dockerfile.dev does not copy this file: there the
; code is a bind mount that changes under the running container). docs/19 C7, docs/DEVOPS_GUIDE.md "OPcache".
;
; validate_timestamps=0: the code of the image never changes - a deploy builds a new image and RECREATES the container,
;   which starts with an empty cache, so PHP never needs to stat a file again. Consequence: a PHP file edited or
;   regenerated inside a RUNNING container (a hand-run `artisan config:cache`, a patched vendor file) is not picked up
;   until php-fpm restarts (`docker compose restart app`).
; save_comments=1: pinned on purpose. Doc comments are read at run time by annotation/docblock based libraries; the
;   build fails if someone turns it off to save memory (Dockerfile checks it).
; max_accelerated_files: `find vendor app -name '*.php' | wc -l` = 16899 (dev vendor; `composer install --no-dev` has
;   fewer) plus ~250 compiled Blade views and the bootstrap/cache files. PHP rounds the value up to a prime of its own
;   list (16229, 32531, 65407, ...): 32531 is ~2x the file count, so the hash table stays sparse.
; memory_consumption / interned_strings_buffer: Laravel + Filament + Livewire load thousands of files and a very large
;   set of class/identifier strings; both are shared memory, reserved lazily. Check with opcache_get_status() after the
;   first real traffic: memory_usage.free_memory, interned_strings_usage.free_memory and
;   opcache_statistics.num_cached_keys vs max_cached_keys (docs/DEVOPS_GUIDE.md).
opcache.enable=1
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=32531
