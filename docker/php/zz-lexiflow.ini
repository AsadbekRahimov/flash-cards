; Production hardening for the app image (php-fpm).
; zend.exception_ignore_args: keep call arguments (chat texts, initData, URLs) out
; of exception traces. This is only a second line of defence: exception MESSAGES
; are not affected (Guzzle puts the bot token into them). Secrets are masked in
; messages by App\Domain\Operations\Support\SecretRedactor: log processor
; (laravel.log / stderr), Sentry hooks and the Telegram client boundary
; (failed_jobs). See docs/DEVOPS_GUIDE.md "Секреты в логах".
zend.exception_ignore_args = On
expose_php = Off
