server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25m;

    # Compression (docs/11 §13). text/html is always compressed by nginx.
    # Already-compressed formats (woff2, mp3 TTS audio, png/jpg/webp) are
    # deliberately NOT listed. Responses < 512 bytes are not worth it.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Telegram Web App SPA — static build output of resources/twa.
    # The inner Vue Router runs in history mode; unknown paths under /twa/
    # fall back to index.html so deep links like /twa/training/123 work.
    location /twa/ {
        # Serve the level-9 `.gz` files emitted by `npm run build`
        # (resources/twa/scripts/precompress.mjs) instead of compressing on
        # every request. Files without a `.gz` fall back to on-the-fly gzip.
        gzip_static on;

        try_files $uri $uri/ /twa/index.html;

        # index.html must always be re-fetched to pick up new asset hashes.
        location = /twa/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        # Hashed assets can be cached forever.
        location ~ ^/twa/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Pre-generated word audio (docs/12 task 1.2c): content-addressed mp3
    # (name = sha1 of text+voice+version), so the file never changes -> cache for
    # a long time. Only audio/ of the public disk is exposed (no `storage:link`
    # needed in this container); mp3 is already compressed -> gzip off.
    location ^~ /storage/audio/ {
        alias /var/www/html/storage/app/public/audio/;
        gzip off;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";

        # ^~ stops the server-level dotfile rule from applying here: deny `.tmp/` (half-written
        # files of WordAudioService) and any other dotfile/dot-directory explicitly.
        location ~ /\. {
            deny all;
        }
    }

    # BREACH mitigation: no response compression for the Filament admin
    # (/admin), the 2FA pages (/2fa) and Livewire (/livewire-<hash>/...):
    # their HTML/JSON carries CSRF tokens and reflects user input, which is
    # exactly what BREACH needs. The traffic is negligible, so it is not worth
    # the risk. (Livewire's hash-prefixed routes also serve livewire.min.js;
    # they must stay with Laravel, not with a static *.js handler.)
    #
    # `gzip off` inside `location /admin { try_files ... /index.php }` would NOT
    # work: try_files does an internal redirect to /index.php, and the response
    # is then produced by `location ~ \.php$` where gzip is on. So these paths
    # are handed to PHP-FPM directly from here, emulating the internal redirect
    # (SCRIPT_NAME/DOCUMENT_URI = /index.php, REQUEST_URI stays the original).
    # Regex location is placed before `\.php$` so it wins; keep the fastcgi
    # params in sync with that block. Filament's static assets live in
    # /css/filament, /js/filament, /fonts/filament (not under /admin) and are
    # not secret, so they keep compression.
    location ~ ^/(?:admin(?:/|$)|2fa(?:/|$)|livewire-) {
        gzip off;

        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_URI /index.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
