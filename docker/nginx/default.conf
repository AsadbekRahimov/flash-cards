map $uri $lexiflow_log_request {
    ~^/telegram/webhook/ "$request_method /telegram/webhook/[redacted] $server_protocol";
    ~^/billing/return/?$ "$request_method /billing/return $server_protocol";
    default $request;
}

log_format lexiflow '$remote_addr - $remote_user [$time_local] "$lexiflow_log_request" '
                    '$status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log lexiflow;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25m;

    # Compression (docs/11 §13). text/html is always compressed by nginx.
    # Already-compressed formats (woff2, mp3 TTS audio, png/jpg/webp) are
    # deliberately NOT listed. Responses < 512 bytes are not worth it.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Telegram Web App SPA — static build output of resources/twa.
    # The inner Vue Router runs in history mode; unknown paths under /twa/
    # fall back to index.html so deep links like /twa/training/123 work.
    location /twa/ {
        # Headers of the static SPA (Laravel SecurityHeaders does not run for files nginx serves itself).
        # CSP: scripts only from self + telegram.org (telegram-web-app.js), API on the same origin,
        # word audio from /storage/audio on the same origin (media-src), no external images/fonts.
        # frame-ancestors is deliberately NOT 'self': Telegram Web (web.telegram.org) embeds the Mini App
        # in an iframe, 'self' would blank it. Native clients use a WebView and ignore frame-ancestors.
        # add_header in a nested location replaces every inherited one, so each block repeats them all.
        gzip_static on;   # serve the *.gz files created by `npm run build` (precompress.mjs); others get on-the-fly gzip

        try_files $uri $uri/ /twa/index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;

        # index.html must always be re-fetched to pick up new asset hashes.
        location = /twa/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
        }
        # Hashed assets can be cached forever.
        location ~ ^/twa/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
        }
    }

    # Pre-generated word audio (docs/12 task 1.2c): content-addressed mp3
    # (name = sha1 of text+voice+version), so the file never changes -> cache for
    # a long time. Only audio/ of the public disk is exposed (no `storage:link`
    # needed in this container); mp3 is already compressed -> gzip off.
    location ^~ /storage/audio/ {
        alias /var/www/html/storage/app/public/audio/;
        gzip off;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";

        # ^~ stops the server-level dotfile rule from applying here: deny `.tmp/` (half-written
        # files of WordAudioService) and any other dotfile/dot-directory explicitly.
        location ~ /\. {
            deny all;
        }
    }

    # Filament's versioned static files (`?v=<Filament version>` in the URL, a hash in the font names): a year of cache.
    location ~ ^/(?:css|js|fonts)/filament/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # This regex location is declared before the server-level dotfile rule and would win over it: deny dotfiles here.
        location ~ /\. {
            deny all;
        }
    }

    # The panels (/admin, /org), the 2FA pages, Livewire (/livewire-<hash>/...), the Telegram webhook and the payment
    # return page go to PHP-FPM straight from here, emulating the internal redirect of try_files (SCRIPT_NAME /
    # DOCUMENT_URI = /index.php, REQUEST_URI stays the original; keep the fastcgi params in sync with `location ~ \.php$`).
    # The webhook and the payment return need it: the redirect of `location /` rewrites $uri to /index.php before the
    # access-log map reads it. The panels are here as the one list of paths App\Http\Middleware\RandomizeResponseLength
    # pads (tests/Unit/DeployInfraConfigTest.php compares the two).
    # Compressed since 16.11.2026 (it was `gzip off` against BREACH): the panel's HTML/JSON gets a random-length
    # random comment / JSON key from that middleware instead - docs/07 §8 «Сжатие и BREACH», DEVOPS_GUIDE «Compression and BREACH».
    location ~ ^/(?:admin(?:/|$)|org(?:/|$)|2fa(?:/|$)|livewire-|telegram/webhook/|billing/return/?$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_URI /index.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
