# /api/ -> app-api in php-fpm mode (APP_SERVER=fpm, the default). Included by docker/nginx/prod.conf (`location ^~ /api/`).
# Handed to PHP-FPM straight from nginx (no try_files: every /api/* URI is index.php); keep the fastcgi params in sync with
# the other PHP locations of prod.conf.
fastcgi_pass lexiflow_api_fpm;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_URI /index.php;
fastcgi_param HTTPS on;
fastcgi_hide_header Strict-Transport-Security;   # nginx sets them (server level)
fastcgi_hide_header X-Content-Type-Options;
