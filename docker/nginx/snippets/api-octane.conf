# /api/ -> app-api in Octane mode (APP_SERVER=octane): FrankenPHP listens on app-api:8000 in plain HTTP, TLS ends here.
# Included by docker/nginx/prod.conf (`location ^~ /api/`). The application trusts these headers only from the compose
# subnet (TRUSTED_PROXIES, config/trustedproxy.php), so the client's own X-Forwarded-* never reach it: X-Forwarded-For is
# REPLACED by $remote_addr (not appended to). docs/DEVOPS_GUIDE.md §0 «Режим контейнера app-api».
proxy_pass http://app-api:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
# Only nginx compresses (gzip in prod.conf); the upstream must not (Caddy would add `encode`).
proxy_set_header Accept-Encoding "";
proxy_set_header Connection "";
proxy_hide_header Strict-Transport-Security;   # nginx sets them (server level)
proxy_hide_header X-Content-Type-Options;
proxy_read_timeout 60s;
