# /api/ -> app-api in Octane mode (APP_SERVER=octane): FrankenPHP listens on app-api:8000 in plain HTTP, TLS ends here.
# Included by docker/nginx/prod.conf (`location ^~ /api/`). The application trusts these headers only from the one address
# of nginx (TRUSTED_PROXIES = NGINX_IPV4, config/trustedproxy.php), and the client's own X-Forwarded-* / Forwarded never reach
# it: X-Forwarded-For is REPLACED by $remote_addr (not appended to), the others are blanked or set here. docs/DEVOPS_GUIDE.md §0 «Режим контейнера app-api».
proxy_pass http://app-api:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
# Only nginx compresses (gzip in prod.conf); the upstream must not (Caddy would add `encode`).
proxy_set_header Accept-Encoding "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded "";
proxy_hide_header Strict-Transport-Security;   # nginx sets them (server level)
proxy_hide_header X-Content-Type-Options;
proxy_read_timeout 60s;
