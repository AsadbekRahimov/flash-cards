# Production Nginx config for LexiFlow Pro.
# Expects APP_DOMAIN env var injected via `envsubst` at container start
# (see docker-compose.prod.yml nginx service command).

# Redirect all HTTP → HTTPS, except ACME HTTP-01 challenge.
server {
    listen 80;
    server_name ${APP_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${APP_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${APP_DOMAIN}/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25m;

    # Compression (docs/11 §13). text/html is always compressed by nginx.
    # Already-compressed formats (woff2, mp3 TTS audio, png/jpg/webp) are
    # deliberately NOT listed. Responses < 512 bytes are not worth it.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # HSTS is also set by Laravel SecurityHeaders middleware; duplicating here
    # guarantees it even for nginx-served static files (/twa/ assets).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /twa/ {
        # Serve the level-9 `.gz` files emitted by `npm run build`
        # (resources/twa/scripts/precompress.mjs) instead of compressing on
        # every request. Files without a `.gz` fall back to on-the-fly gzip.
        gzip_static on;

        try_files $uri $uri/ /twa/index.html;

        location = /twa/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~ ^/twa/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # BREACH mitigation: no response compression for the Filament admin
    # (/admin), the 2FA pages (/2fa) and Livewire (/livewire-<hash>/...):
    # their HTML/JSON carries CSRF tokens and reflects user input, which is
    # exactly what BREACH needs. The traffic is negligible, so it is not worth
    # the risk. (Livewire's hash-prefixed routes also serve livewire.min.js;
    # they must stay with Laravel, not with a static *.js handler.)
    #
    # `gzip off` inside `location /admin { try_files ... /index.php }` would NOT
    # work: try_files does an internal redirect to /index.php, and the response
    # is then produced by `location ~ \.php$` where gzip is on. So these paths
    # are handed to PHP-FPM directly from here, emulating the internal redirect
    # (SCRIPT_NAME/DOCUMENT_URI = /index.php, REQUEST_URI stays the original).
    # Regex location is placed before `\.php$` so it wins; keep the fastcgi
    # params in sync with that block. Filament's static assets live in
    # /css/filament, /js/filament, /fonts/filament (not under /admin) and are
    # not secret, so they keep compression.
    location ~ ^/(?:admin(?:/|$)|2fa(?:/|$)|livewire-) {
        gzip off;

        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param HTTPS on;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
