# Production Nginx config for LexiFlow Pro.
# Expects APP_DOMAIN and APP_SERVER (fpm|octane) env vars injected via `envsubst` at container start
# (see docker/nginx-entrypoint.sh; the nginx service in docker-compose.prod.yml).
# Behind Cloudflare (CLOUDFLARE_PROXY=true) the entrypoint also writes conf.d/00-cloudflare-real-ip.conf (http context:
# set_real_ip_from for the Cloudflare ranges + real_ip_header CF-Connecting-IP), so $remote_addr below is the visitor.

# Docker can assign a new IP to an upstream after a container is replaced. Refresh it without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream lexiflow_app_fpm {
    zone lexiflow_app_fpm 64k;
    server app:9000 resolve;
}

upstream lexiflow_api_fpm {
    zone lexiflow_api_fpm 64k;
    server app-api:9000 resolve;
}

# Octane mode of app-api (APP_SERVER=octane): a named upstream so that nginx keeps a pool of idle connections to FrankenPHP
# open between requests (`keepalive`) instead of a TCP handshake per request - snippets/api-octane.conf proxies to it with
# `proxy_http_version 1.1` + `Connection ""`. Idle connections cost FrankenPHP nothing (Caddy threads, not PHP workers), so
# 32 is above the number of php workers (OCTANE_WORKERS) and the concurrency nginx reaches in practice. Under
# APP_SERVER=fpm the block is unused (php-fpm would tie a worker to every idle keep-alive connection, so no pool there).
upstream lexiflow_api_octane {
    zone lexiflow_api_octane 64k;
    server app-api:8000 resolve;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Keep method, status and timing for these routes without putting URL credentials in the access log.
map $uri $lexiflow_log_request {
    ~^/telegram/webhook/ "$request_method /telegram/webhook/[redacted] $server_protocol";
    ~^/billing/return/?$ "$request_method /billing/return $server_protocol";
    default $request;
}

# Flood guard for the paths nobody is logged in on (audit 2026-11-10 §2): the auth endpoint of the Mini App, the Telegram and
# billing entry points and the public site (landing, legal pages) get 30 requests a second per client address with a burst of
# 60 (a generous ceiling, a real learner or a browser loading a page never nears it); beyond it nginx answers 429 itself and
# the flood never reaches PHP. The key is empty - the request is not counted - for everything else: the probes (/up, /health/*),
# ACME, the assets, the signed-in parts (/api/* but the auth, /admin, /org, /livewire, /2fa) and Telegram's own servers (their
# webhook deliveries come from a few addresses at a rate that grows with the bot). $binary_remote_addr is the real client
# address: the realip module has already swapped it.
map $uri $lexiflow_public_path {
    default 0;
    ~^/api/twa/auth/?$ 1;
    ~^/telegram/webhook/ 1;
    ~^/billing/return/?$ 1;
    ~^/(?!(?:up|health|\.well-known|twa|build|storage|api|admin|org|2fa|livewire)(?:[/-]|$)) 1;
}
geo $remote_addr $lexiflow_telegram_origin {
    default 0;
    149.154.160.0/20 1;
    91.108.4.0/22 1;
}
map "$lexiflow_public_path:$lexiflow_telegram_origin" $lexiflow_limit_key {
    "1:0" $binary_remote_addr;
    default "";
}
limit_req_zone $lexiflow_limit_key zone=lexiflow_public:10m rate=30r/s;
log_format lexiflow '$remote_addr - $remote_user [$time_local] "$lexiflow_log_request" '
                    '$status $body_bytes_sent rt=$request_time';

# Any Host that is not ${APP_DOMAIN} (a request by IP, a forged Host, a foreign domain pointed at this server) gets its
# connection closed: with a TLS handshake refused before any certificate is shown. The named blocks below match by server_name.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

# Redirect all HTTP → HTTPS, except ACME HTTP-01 challenge.
server {
    listen 80;
    server_name ${APP_DOMAIN};
    server_tokens off;
    access_log /var/log/nginx/access.log lexiflow buffer=64k flush=1s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${APP_DOMAIN};
    server_tokens off;   # no nginx version in the Server header (ZAP 10036)
    access_log /var/log/nginx/access.log lexiflow buffer=64k flush=1s;

    # Origin lock (CLOUDFLARE_ONLY=true): generated by the entrypoint - `if ($lexiflow_from_cloudflare = 0) { return 403; }`,
    # an EMPTY file otherwise. Only here (443): port 80 keeps answering the ACME challenge for certbot.
    # `if` cannot live in conf.d (http context), hence a snippet included into the server. docs/23_CLOUDFLARE_RU.md.
    include /etc/nginx/snippets-generated/cloudflare-only.conf;
    limit_req zone=lexiflow_public burst=60 nodelay;
    limit_req_status 429;

    ssl_certificate     /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${APP_DOMAIN}/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25m;

    # Compression (docs/11 §13). text/html is always compressed by nginx.
    # Already-compressed formats (woff2, mp3 TTS audio, png/jpg/webp) are
    # deliberately NOT listed. Responses < 512 bytes are not worth it.
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # HSTS and nosniff are issued by nginx only, for every response (static files and PHP alike),
    # so each response has exactly one source of them. Responses from PHP-FPM carry the same headers
    # from Laravel SecurityHeaders; the PHP locations drop those with fastcgi_hide_header
    # (otherwise ZAP 10035 "multiple entries"). CSP, Referrer-Policy, X-Frame-Options and
    # Permissions-Policy stay with the application: they depend on the page.
    # add_header in a location replaces ALL server-level ones, so locations with their own
    # add_header (/twa/, /storage/audio/) must repeat both.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /twa/ {
        # Headers of the static SPA (Laravel SecurityHeaders does not run for files nginx serves itself).
        # CSP: scripts only from self + telegram.org (telegram-web-app.js), API on the same origin,
        # word audio from /storage/audio on the same origin (media-src), no external images/fonts.
        # frame-ancestors is deliberately NOT 'self': Telegram Web (web.telegram.org) embeds the Mini App
        # in an iframe, 'self' would blank it. Native clients use a WebView and ignore frame-ancestors.
        # add_header in a nested location replaces every inherited one, so each block repeats them all.
        gzip_static on;   # serve the *.gz files created by `npm run build` (precompress.mjs); others get on-the-fly gzip

        try_files $uri $uri/ /twa/index.html;

        # Whatever is not hashed (icons, favicon...) is revalidated by ETag; the two nested locations below set their own.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

        # index.html must always be re-fetched to pick up new asset hashes.
        location = /twa/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        }
        # Hashed assets can be cached forever.
        location ~ ^/twa/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        }
    }

    # Pre-generated word audio (docs/12 task 1.2c): content-addressed mp3
    # (name = sha1 of text+voice+version), so the file never changes -> cache for
    # a long time. Only audio/ of the public disk is exposed (no `storage:link`
    # needed in this container); mp3 is already compressed -> gzip off.
    location ^~ /storage/audio/ {
        alias /var/www/html/storage/app/public/audio/;
        gzip off;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # add_header in a location drops server-level headers; repeat HSTS and nosniff.
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ^~ stops the server-level dotfile rule from applying here: deny `.tmp/` (half-written
        # files of WordAudioService) and any other dotfile/dot-directory explicitly.
        location ~ /\. {
            deny all;
        }
    }

    # BREACH mitigation: no response compression for the Filament admin
    # (/admin), the 2FA pages (/2fa) and Livewire (/livewire-<hash>/...):
    # their HTML/JSON carries CSRF tokens and reflects user input, which is
    # exactly what BREACH needs. The traffic is negligible, so it is not worth
    # the risk. (Livewire's hash-prefixed routes also serve livewire.min.js;
    # they must stay with Laravel, not with a static *.js handler.)
    #
    # `gzip off` inside `location /admin { try_files ... /index.php }` would NOT
    # work: try_files does an internal redirect to /index.php, and the response
    # is then produced by `location ~ \.php$` where gzip is on. So these paths
    # are handed to PHP-FPM directly from here, emulating the internal redirect
    # (SCRIPT_NAME/DOCUMENT_URI = /index.php, REQUEST_URI stays the original).
    # Regex location is placed before `\.php$` so it wins; keep the fastcgi
    # params in sync with that block. Filament's static assets live in
    # /css/filament, /js/filament, /fonts/filament (not under /admin) and are
    # not secret, so they keep compression.
    # Webhook and payment return also go straight to the front controller so the log map sees their original path.
    location ~ ^/(?:admin(?:/|$)|org(?:/|$)|2fa(?:/|$)|livewire-|telegram/webhook/|billing/return/?$) {
        gzip off;

        fastcgi_pass lexiflow_app_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param HTTPS on;
        fastcgi_hide_header Strict-Transport-Security;   # nginx sets them (server level)
        fastcgi_hide_header X-Content-Type-Options;
    }

    # The TWA API goes to its own php-fpm container: `app-api` (APP_SURFACE=api - only routes/api.php, no Filament /
    # Livewire; docs/DEVOPS_GUIDE.md §0 «Две поверхности приложения»). `^~` is a prefix match that beats every regex
    # location, so each /api/* request lands here - the audio streams of the practice and the game
    # (/api/twa/.../audio/...) included: audio/mpeg is not in gzip_types, so they stay uncompressed, as before.
    # The way to app-api depends on its mode (APP_SERVER, docs/DEVOPS_GUIDE.md §0 «Режим контейнера app-api»): the snippet
    # api-fpm.conf (FastCGI to app-api:9000) or api-octane.conf (proxy_pass to FrankenPHP
    # on app-api:8000). ${APP_SERVER} is substituted by the entrypoint; the snippets themselves are included as they are.
    # A bare `/api` (no slash) and anything else go to `app`.
    location ^~ /api/ {
        include /etc/nginx/snippets/api-${APP_SERVER}.conf;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass lexiflow_app_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_hide_header Strict-Transport-Security;   # nginx sets them (server level)
        fastcgi_hide_header X-Content-Type-Options;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
