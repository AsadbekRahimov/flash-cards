# Coolify variant of prod.conf (docker-compose.coolify.yml, Dockerfile stage nginx-coolify).
# Differences from prod.conf: no :80 -> :443 redirect server and no certbot/ACME location (Traefik terminates TLS and
# issues certificates), `listen 80` instead of `listen 443 ssl` + ssl_*, upstreams point at the lf-app / lf-api services,
# and the client address is taken from X-Forwarded-For set by Traefik. Everything else (CSP, HSTS, routing of /admin,
# /api, /twa, audio) is the same. Keep both files in step when changing routing or headers.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream lexiflow_app_fpm {
    zone lexiflow_app_fpm 64k;
    server lf-app-private:9000 resolve;
}
upstream lexiflow_api_fpm {
    zone lexiflow_api_fpm 64k;
    server lf-api-private:9000 resolve;
}
upstream lexiflow_api_octane {
    zone lexiflow_api_octane 64k;
    server lf-api-private:8000 resolve;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
map $uri $lexiflow_log_request {
    ~^/telegram/webhook/ "$request_method /telegram/webhook/[redacted] $server_protocol";
    ~^/billing/return/?$ "$request_method /billing/return $server_protocol";
    default $request;
}
# Flood guard for the paths nobody is logged in on (audit 2026-11-10 §2): the auth endpoint of the Mini App, the Telegram and
# billing entry points and the public site (landing, legal pages) get 30 requests a second per client address with a burst of
# 60 (a generous ceiling, a real learner or a browser loading a page never nears it); beyond it nginx answers 429 itself and
# the flood never reaches PHP. The key is empty - the request is not counted - for everything else: the probes (/up, /health/*),
# ACME, the assets, the signed-in parts (/api/* but the auth, /admin, /org, /livewire, /2fa) and Telegram's own servers (their
# webhook deliveries come from a few addresses at a rate that grows with the bot). $binary_remote_addr is the real client
# address: the realip module has already swapped it.
map $uri $lexiflow_public_path {
    default 0;
    ~^/api/twa/auth/?$ 1;
    ~^/telegram/webhook/ 1;
    ~^/billing/return/?$ 1;
    ~^/(?!(?:up|health|\.well-known|twa|build|storage|api|admin|org|2fa|livewire)(?:[/-]|$)) 1;
}
geo $remote_addr $lexiflow_telegram_origin {
    default 0;
    149.154.160.0/20 1;
    91.108.4.0/22 1;
}
map "$lexiflow_public_path:$lexiflow_telegram_origin" $lexiflow_limit_key {
    "1:0" $binary_remote_addr;
    default "";
}
limit_req_zone $lexiflow_limit_key zone=lexiflow_public:10m rate=30r/s;
# PHP unreachable (502: lf-app / lf-api down, being replaced, not started yet; 504: no answer in time): nginx answers itself,
# as in prod.conf - the plain status for the webhook, the payments and the probes, JSON for /api/, the branded 503 page for the
# rest. Only nginx's own errors: *_intercept_errors stay off, a 5xx of the application passes as it is.
map $request_uri $lexiflow_upstream_plain {
    default 0;
    ~^/(?:telegram/webhook/|billing/|up(?:[/?]|$)|health(?:[/?]|$)) 1;
}
map $lexiflow_upstream_plain $lexiflow_down_502 {
    1 @lexiflow_down_502;
    default @lexiflow_down_page;
}
map $lexiflow_upstream_plain $lexiflow_down_504 {
    1 @lexiflow_down_504;
    default @lexiflow_down_page;
}
log_format lexiflow '$remote_addr - $remote_user [$time_local] "$lexiflow_log_request" '
                    '$status $body_bytes_sent rt=$request_time';
server {
    listen 80;
    # Any host: Traefik already routes only the domains assigned in Coolify to lf-nginx, so the domain lives in
    # Coolify alone and changes there (test domain now, the real one later) need no change here.
    server_name _;
    server_tokens off;   # no nginx version in the Server header (ZAP 10036)
    access_log /var/log/nginx/access.log lexiflow buffer=64k flush=1s;
    include /etc/nginx/snippets-generated/cloudflare-only.conf;
    limit_req zone=lexiflow_public burst=60 nodelay;
    limit_req_status 429;
    # PHP unreachable (see the maps $lexiflow_down_*): inherited by every location that has no error_page of its own.
    # recursive_error_pages: @lexiflow_down_page answers 503 and lets its own error_page serve the file; the other named
    # locations `return` with a body, which is never an error page again, so nothing loops.
    error_page 502 = $lexiflow_down_502;
    error_page 504 = $lexiflow_down_504;
    recursive_error_pages on;
    # Coolify: TLS terminates in Traefik (coolify-proxy). Real client IP comes from X-Forwarded-For, trusted only when the
    # TCP peer is the proxy (TRUSTED_PROXY_CIDRS, generated by nginx-entrypoint.sh: the Docker private ranges by default, the
    # proxy network once the compose file narrows it) or, if used, a Cloudflare edge. Traefik must itself keep the header
    # honest (forwardedHeaders.trustedIPs = Cloudflare ranges only, never insecure): docs/22 §«Coolify: сети», M4.
    include /etc/nginx/snippets-generated/realip-proxy.conf;
    include /etc/nginx/snippets/realip-cloudflare.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 25m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 512;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # CSP of the Mini App as in prod.conf: $lexiflow_audio_origin is the R2 domain of the word audio (media-src only, docs/26 §9.9),
    # generated by nginx-entrypoint.sh from AUDIO_PUBLIC_URL, empty when unset (docs/26 §5.4).
    location /twa/ {
        gzip_static on;   # serve the *.gz files created by `npm run build` (precompress.mjs); others get on-the-fly gzip
        try_files $uri $uri/ /twa/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data: $lexiflow_audio_origin; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        location = /twa/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data: $lexiflow_audio_origin; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        }
        location ~ ^/twa/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data: $lexiflow_audio_origin; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        }
    }
    # Word audio at /audio/ on the main domain (docs/31 §5д), as in prod.conf; /storage/audio/ stays for the old addresses.
    location ^~ /audio/ {
        alias /var/www/html/storage/app/public/audio/;
        limit_except GET {
            deny all;
        }
        # `return` is the one directive that is safe inside `if` in a location.
        if ($uri !~ "^/audio/[A-Za-z0-9_-]+\.mp3$") {
            return 404;
        }
        gzip off;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /storage/audio/ {
        alias /var/www/html/storage/app/public/audio/;
        gzip off;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        location ~ /\. {
            deny all;
        }
    }
    # Share cards at /storage/share-cards/ (docs/36 §2б), as in prod.conf: GET/HEAD and the names of the renderer only.
    location ^~ /storage/share-cards/ {
        alias /var/www/html/storage/app/public/share-cards/;
        limit_except GET {
            deny all;
        }
        # `return` is the one directive that is safe inside `if` in a location.
        if ($uri !~ "^/storage/share-cards/[a-z0-9_]{1,40}-(ru|uz)-[0-9a-f]{20}\.jpg$") {
            return 404;
        }
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Filament's versioned static files: a year of cache (see prod.conf). add_header drops the server-level ones; repeat them.
    location ~ ^/(?:css|js|fonts)/filament/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        location ~ /\. {
            deny all;
        }
    }
    # Direct FastCGI (the webhook and the payment return keep their original $uri for the access-log map; the panels are
    # the padded paths of App\Http\Middleware\RandomizeResponseLength). Compressed since 16.11.2026: see prod.conf.
    location ~ ^/(?:admin(?:/|$)|org(?:/|$)|2fa(?:/|$)|livewire-|telegram/webhook/|billing/return/?$) {
        fastcgi_pass lexiflow_app_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_URI /index.php;
        fastcgi_param HTTPS on;
        fastcgi_hide_header Strict-Transport-Security;   # nginx sets them (server level)
        fastcgi_hide_header X-Content-Type-Options;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/api-${APP_SERVER}.conf;
        # app-api unreachable: the JSON error envelope of the API (ApiErrorResource), not a page (see prod.conf).
        error_page 502 504 = @lexiflow_down_api;
    }
    # PHP unreachable (the maps $lexiflow_down_*), as in prod.conf. The plain status for the webhook, the payments and the
    # probes: a `return` with a body is a response of its own, not an error page (recursive_error_pages above).
    location @lexiflow_down_502 {
        default_type text/plain;
        return 502 "Bad Gateway\n";
    }
    location @lexiflow_down_504 {
        default_type text/plain;
        return 504 "Gateway Timeout\n";
    }
    location @lexiflow_down_api {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":{"code":"maintenance","message":"The service is being updated. Try again in a minute."}}';
    }
    # The branded page with 503 (no `=`: the status stays), public/maintenance.html; the location below is internal.
    location @lexiflow_down_page {
        error_page 503 /maintenance.html;
        return 503;
    }
    location = /maintenance.html {
        internal;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass lexiflow_app_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_hide_header Strict-Transport-Security;   # nginx sets them (server level)
        fastcgi_hide_header X-Content-Type-Options;
    }
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
