services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: lexiflow/app:dev
        container_name: lexiflow-app
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_healthy
        volumes:
            - ./:/var/www/html
        environment:
            PHP_IDE_CONFIG: serverName=lexiflow
            # The second Redis instance as the application sees it (docs/19 §4): the host and port inside the compose
            # network and the very password compose gives `redis-cache` (REDIS_CACHE_PASSWORD, empty = none). Real
            # environment wins over .env, so the REDIS_LRU_* lines of .env matter only outside the containers.
            REDIS_LRU_HOST: redis-cache
            REDIS_LRU_PORT: "6379"
            REDIS_LRU_PASSWORD: ${REDIS_CACHE_PASSWORD:-}

    nginx:
        image: nginx:1.30-alpine
        container_name: lexiflow-nginx
        depends_on:
            - app
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    postgres:
        image: postgres:18-alpine
        container_name: lexiflow-postgres
        # Wrapper in front of the official entrypoint (docker/postgres/entrypoint-guard.sh, mounted below): refuses to
        # start 18 when the 16 cluster in `pgdata` ran after the data move (a rollback) - the 18 data would be stale.
        # `entrypoint:` discards the image's CMD, hence the explicit `command`; run through `sh` so the bind-mounted
        # file needs no execute bit on the host.
        entrypoint: ["/bin/sh", "/usr/local/bin/lexiflow-entrypoint-guard.sh"]
        command: ["postgres"]
        environment:
            POSTGRES_DB: ${DB_DATABASE:-lexiflow}
            POSTGRES_USER: ${DB_USERNAME:-lexiflow}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
            # What the guard tells the operator to run when it refuses (the dev stack: no --prod), and how to start the
            # stack again afterwards.
            LEXIFLOW_UPGRADE_CMD: bash docker/postgres/upgrade.sh
            LEXIFLOW_UP_CMD: docker compose up -d
        ports:
            # Loopback only: a dev database with a known password must not be reachable from the local network.
            - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
        volumes:
            # 18+ images keep the cluster in /var/lib/postgresql/<major>/docker: one mount at /var/lib/postgresql,
            # the volume name carries no version. Data of the ≤16 stack lives in the old volume `pgdata`
            # (mounted at /var/lib/postgresql/data); `make pg-upgrade` moves it here (docs/DEVOPS_GUIDE.md §0).
            - postgresql:/var/lib/postgresql
            # Guard: the old volume stays mounted read-only where the 18+ entrypoint looks for unmigrated clusters
            # (/var/lib/postgresql/*/docker). While it still holds a 16 cluster and the 18 cluster does not exist,
            # the container refuses to initialise an empty database (downtime, never an empty DB), whatever
            # starts it - an old deploy.sh, a plain `docker compose up -d`. An empty or absent old volume is harmless.
            - pgdata:/var/lib/postgresql/16/docker:ro
            - ./docker/postgres/entrypoint-guard.sh:/usr/local/bin/lexiflow-entrypoint-guard.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lexiflow}"]
            interval: 5s
            timeout: 3s
            retries: 10

    # Two Redis instances (docs/19_REDIS_CACHE_PLAN.md §4):
    #   redis       - queues, sessions, locks, rate limits, markers, the entitlement version keys: `noeviction` + AOF,
    #                 nothing here may ever be dropped by memory pressure;
    #   redis-cache - the pure cache (store `lru`): `volatile-lru`, no persistence - a lost key is recomputed.
    # Exact image tag on purpose (not the floating redis:8-alpine): the image is reproducible and the next upgrade is a
    # decision, not an accident. 8.10 writes RDB format 15: a `redisdata` volume written by it does not start on 8.4 again
    # (dev: recreate the volume if an older version is ever needed).
    # The optional password (empty = none, fine for dev) reaches redis-server as a config line on stdin, not as a command
    # line argument; the healthcheck authenticates through REDISCLI_AUTH, so the password is in no argument list either.
    # It remains readable in the container environment (`docker inspect`) - see docs/DEVOPS_GUIDE.md, "Redis".
    # `null` and `(null)` count as "no password": older .env files say `REDIS_PASSWORD=null`, which Laravel's env() reads
    # as PHP null (no AUTH sent) while compose would hand the literal word to redis-server - a NOAUTH on every request.
    redis:
        image: redis:8.10-alpine
        container_name: lexiflow-redis
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        command:
            - sh
            - -c
            - |
              case "$$REDIS_PASSWORD" in ''|null|'(null)') AUTH='' ;; *) AUTH="requirepass $$REDIS_PASSWORD" ;; esac
              exec redis-server - --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction <<EOF
              $$AUTH
              EOF
        ports:
            - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD-SHELL", "case \"$$REDIS_PASSWORD\" in ''|null|'(null)') ;; *) export REDISCLI_AUTH=\"$$REDIS_PASSWORD\" ;; esac; redis-cli ping | grep -q PONG"]
            interval: 5s
            timeout: 3s
            retries: 10

    redis-cache:
        image: redis:8.10-alpine
        container_name: lexiflow-redis-cache
        environment:
            REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:-}
        # No AOF, no RDB: the cache starts empty after a restart, which is the point. Only keys with a TTL are evicted
        # (every pure-cache key has one, docs/19 §3 rule 4).
        command:
            - sh
            - -c
            - |
              case "$$REDIS_PASSWORD" in ''|null|'(null)') AUTH='' ;; *) AUTH="requirepass $$REDIS_PASSWORD" ;; esac
              exec redis-server - --appendonly no --save "" --maxmemory ${REDIS_CACHE_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru <<EOF
              $$AUTH
              EOF
        ports:
            - "127.0.0.1:${REDIS_CACHE_PORT_HOST:-6380}:6379"
        healthcheck:
            test: ["CMD-SHELL", "case \"$$REDIS_PASSWORD\" in ''|null|'(null)') ;; *) export REDISCLI_AUTH=\"$$REDIS_PASSWORD\" ;; esac; redis-cli ping | grep -q PONG"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgresql:
    # ≤16 data (rollback copy), mounted read-only into postgres as a guard; nothing writes it. Removed in a later release.
    pgdata:
    redisdata:
