# Production compose for LexiFlow Pro.
#
# Differences from docker-compose.yml (dev):
#   - No host bind-mount of the app source — image ships pre-baked code.
#   - Postgres/Redis ports are NOT exposed to host.
#   - Two Redis instances: `redis` (queues, sessions, locks, limits; noeviction + AOF) and `redis-cache` (the pure
#     cache store `lru`; volatile-lru, no persistence) - docs/19_REDIS_CACHE_PLAN.md §4. Both require a password.
#   - nginx serves HTTPS via Let's Encrypt, renewed by certbot sidecar.
#   - Dedicated queue worker containers (separate from php-fpm), one pool per queue: queue-high (`high`),
#     queue-default (`default`) and queue-low (`low`). A worker takes queues in strict priority order, so a shared
#     `default,low` worker starves `low` while `default` is never empty (a reminder broadcast at the Telegram
#     limit of 25/s keeps it busy for minutes): the `low` heartbeat then goes stale and /health/ready fails on `queue`.
#   - Two php-fpm containers of the same image (docs/DEVOPS_GUIDE.md §0 «Две поверхности приложения: app и app-api»):
#     `app` (APP_SURFACE=full: /admin, /org, the public site, the Telegram and payment webhooks, /2fa, /up, /health/ready)
#     and `app-api` (APP_SURFACE=api: /api/* of the TWA Mini App only - no Filament / Livewire registered, no web routes;
#     also answers /up and /health/ready). nginx sends `/api/` to app-api and everything else to app. Each has a php-fpm
#     pool of its own (PHP_FPM_* and PHP_FPM_API_* in .env; defaults below). The queue workers and the scheduler are full.
#   - All services restart unless explicitly stopped.
#   - `pgbouncer` (transaction pooling, image built from the Dockerfile stage `pgbouncer`) between the application and
#     PostgreSQL: .env says DB_HOST=pgbouncer, the application keeps one persistent PDO connection per php-fpm worker
#     (DB_PERSISTENT=true), while migrations (deploy.sh) and pg_dump go straight to `postgres` through the Laravel connection
#     `pgsql_direct` (DB_DIRECT_HOST, set below). To run without the pooler: DB_HOST=postgres in .env, nothing else.
#     docs/DEVOPS_GUIDE.md §0 «pgbouncer и постоянные соединения».
#
# Required env vars (populate via .env on the host, chmod 600):
#   APP_DOMAIN, APP_KEY, DB_PASSWORD, REDIS_PASSWORD, REDIS_CACHE_PASSWORD, TELEGRAM_BOT_TOKEN,
#   TELEGRAM_URL_SECRET, TELEGRAM_HEADER_SECRET, TWA_JWT_SECRET, TWA_BASE_URL, CERTBOT_EMAIL
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

# The second Redis instance as the application sees it (docs/19 §4): the host and port inside the compose network and
# the very password compose gives `redis-cache` - one REDIS_CACHE_PASSWORD in .env, nothing to keep equal by hand.
# `environment` wins over `env_file`, so the REDIS_LRU_* lines of .env do not apply inside the containers.
# The application services depend on `redis-cache` as `service_started`, not `service_healthy`: the pure cache is a
# failover chain (config/cache.php `lru`, docs/19 §4.1) - without the second instance the application serves from the
# database and /health/ready says `degraded`. Waiting for `healthy` would tie the whole application to a disposable
# component; `redis` (queues, sessions, locks) stays `service_healthy`.
x-lru-env: &lru-env
    # The surface of the process (App\Support\Surface): every service of the image is `full` unless its own `environment:`
    # says otherwise (only `app-api` does). `environment:` always wins over `env_file`, so an APP_SURFACE line in .env can
    # never turn the panels, the webhooks, the queue workers or the scheduler into api-only processes.
    APP_SURFACE: full
    REDIS_LRU_HOST: redis-cache
    REDIS_LRU_PORT: "6379"
    REDIS_LRU_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required in production - set it in .env (openssl rand -hex 32)}
    # PostgreSQL itself, past the pooler (Laravel connection `pgsql_direct`: migrations, pg_dump). The service names are
    # facts of this file, so they are set here and not in .env; a bare server would set DB_DIRECT_HOST in .env instead.
    DB_DIRECT_HOST: ${DB_DIRECT_HOST:-postgres}
    DB_DIRECT_PORT: ${DB_DIRECT_PORT:-5432}
    # Nobody is a trusted proxy by default: `app`, the queue workers and the scheduler read the whole .env (env_file), and
    # a TRUSTED_PROXIES line there must not make them believe a client's X-Forwarded-For (php-fpm passes the client's
    # HTTP_X_FORWARDED_* through FastCGI). Only `app-api` in Octane mode trusts the one address of nginx (below).
    TRUSTED_PROXIES: ""

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: lexiflow/app:${IMAGE_TAG:-latest}
        container_name: lexiflow-app
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            pgbouncer:
                condition: service_healthy
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_started
        env_file: .env
        environment:
            <<: *lru-env
            # The php-fpm pool of the full surface: panels, webhooks and the public site - a few people and the bots, while the
            # learners are on app-api. 6 of the 18 workers of a 4 vCPU host (docs/DEVOPS_GUIDE.md §0 «Пул php-fpm»); a PHP_FPM_*
            # line in .env still overrides (compose interpolates .env), and the image default of 16 applies only outside compose.
            PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-6}
            PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-2}
            PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-1}
            PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-3}
        volumes:
            - app_storage:/var/www/html/storage
            # Pre-generated word audio (docs/12 task 1.2c): its own volume, shared read-only with nginx.
            - app_audio:/var/www/html/storage/app/public/audio

    # The TWA API on its own php-fpm pool (App\Support\Surface, docs/DEVOPS_GUIDE.md §0 «Две поверхности приложения»): the
    # same image, APP_SURFACE=api - only routes/api.php, /up and /health/ready are loaded, the panel providers and the
    # packages of the admin UI (Filament, Livewire, Blade icons, ...) are not registered, so a learner's request pays for
    # none of them and this process carries none of that code. nginx routes `/api/` here. Its caches (config, routes,
    # events) are built at start by the entrypoint with this surface; `view:cache` and `filament:optimize` are skipped.
    # The server inside is chosen by APP_SERVER in .env (docs/DEVOPS_GUIDE.md §0 «Режим контейнера app-api»): `fpm` (default
    # and when unset) - the stage `app-fpm`, the very image of `app`, php-fpm on :9000; `octane` - the stage `app-octane`,
    # Laravel Octane on FrankenPHP on :8000 (docs/21_OCTANE_READINESS.md). nginx follows the same variable. Switching back
    # is `APP_SERVER=fpm` + `up -d app-api nginx`: deploy.sh always builds the fpm image, so no build is needed.
    app-api:
        build:
            context: .
            dockerfile: Dockerfile
            target: app-${APP_SERVER:-fpm}
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: lexiflow/app-${APP_SERVER:-fpm}:${IMAGE_TAG:-latest}
        container_name: lexiflow-app-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            pgbouncer:
                condition: service_healthy
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_started
        env_file: .env
        environment:
            <<: *lru-env
            APP_SURFACE: api
            # Livewire is not registered here: Sentry's Livewire breadcrumbs and tracing would hook an auto-built manager.
            SENTRY_BREADCRUMBS_LIVEWIRE_ENABLED: "false"
            SENTRY_TRACE_LIVEWIRE_ENABLED: "false"
            # Learner traffic is most of the requests: 12 of the 18 workers of a 4 vCPU host (2-4 per core all in all,
            # docs/DEVOPS_GUIDE.md §0 «Пул php-fpm»). Override with PHP_FPM_API_* in .env; pm.max_requests is PHP_FPM_MAX_REQUESTS.
            PHP_FPM_MAX_CHILDREN: ${PHP_FPM_API_MAX_CHILDREN:-12}
            PHP_FPM_START_SERVERS: ${PHP_FPM_API_START_SERVERS:-3}
            PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_API_MIN_SPARE_SERVERS:-2}
            PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_API_MAX_SPARE_SERVERS:-4}
            # Octane mode only (ignored by php-fpm): 6 workers on 4 vCPU, a worker restarts after OCTANE_MAX_REQUESTS requests.
            OCTANE_WORKERS: ${OCTANE_WORKERS:-6}
            OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
            # Always behind nginx with TLS, whatever the mode: the scheme of the application is https (config/octane.php reads
            # it under Octane only, so under php-fpm the line is harmless).
            OCTANE_HTTPS: "true"
            # Proxies whose X-Forwarded-* the application believes (config/trustedproxy.php): the ONE address of nginx, never a
            # subnet. Connections that reach nginx through docker-proxy (IPv6 clients on [::]:443, hairpin from the host) come
            # from the network gateway (172.28.0.1), which is inside the subnet: trusting the subnet would make php-fpm believe
            # a forged X-Forwarded-For (limits, Telegram/Payme/Click allowlists). Under php-fpm REMOTE_ADDR over FastCGI is never
            # the address of nginx, so trusting it is harmless there. It is the address `nginx` is pinned to below (NGINX_IPV4);
            # if you set TRUSTED_PROXIES in .env, it must stay one address (or a short list), never `*` and never a /16.
            # docs/07_SECURITY.md «Доверенные прокси».
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${NGINX_IPV4:-172.28.0.10}}
            # php-fpm: the persistent PDO connection per worker (default). Octane: one worker = one connection, and a persistent
            # PDO gets in the way of disconnect() after a leaked transaction - set APP_API_DB_PERSISTENT=false with APP_SERVER=octane.
            DB_PERSISTENT: ${APP_API_DB_PERSISTENT:-true}
        # Octane finishes the requests in flight on SIGTERM.
        stop_grace_period: 30s
        volumes:
            # The same storage volume as `app`: logs, the file markers of the cache circuit breaker, compiled Blade (the api
            # surface compiles only the framework's error pages, on first use - identical sources give identical files).
            - app_storage:/var/www/html/storage
            - app_audio:/var/www/html/storage/app/public/audio

    # Three worker pools: `high` (Telegram replies, payments) is never stuck behind bulk work on default/low,
    # and `low` (long TTS jobs) is never starved by a steady stream of `default`.
    queue-high:
        image: lexiflow/app:${IMAGE_TAG:-latest}
        container_name: lexiflow-queue-high
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_started
        env_file: .env
        environment:
            <<: *lru-env
        volumes:
            - app_storage:/var/www/html/storage
            - app_audio:/var/www/html/storage/app/public/audio
        command: ["php", "artisan", "queue:work", "redis", "--queue=high", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]

    queue-default:
        image: lexiflow/app:${IMAGE_TAG:-latest}
        container_name: lexiflow-queue-default
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_started
        env_file: .env
        environment:
            <<: *lru-env
        volumes:
            - app_storage:/var/www/html/storage
            - app_audio:/var/www/html/storage/app/public/audio
        command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]

    # TTS (PregenerateWordAudioJob, GeneratePracticeAudioJob): long jobs on their own pool.
    queue-low:
        image: lexiflow/app:${IMAGE_TAG:-latest}
        container_name: lexiflow-queue-low
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_started
        env_file: .env
        environment:
            <<: *lru-env
        volumes:
            - app_storage:/var/www/html/storage
            - app_audio:/var/www/html/storage/app/public/audio
        command: ["php", "artisan", "queue:work", "redis", "--queue=low", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600"]

    scheduler:
        image: lexiflow/app:${IMAGE_TAG:-latest}
        container_name: lexiflow-scheduler
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
            redis-cache:
                condition: service_started
        env_file: .env
        environment:
            <<: *lru-env
        volumes:
            - app_storage:/var/www/html/storage
            - app_audio:/var/www/html/storage/app/public/audio
        command: ["php", "artisan", "schedule:work"]

    nginx:
        build:
            context: .
            dockerfile: Dockerfile
            target: nginx
        image: lexiflow/nginx:${IMAGE_TAG:-latest}
        container_name: lexiflow-nginx
        restart: unless-stopped
        # Both upstreams: nginx resolves `app:9000` and `app-api:9000` when it loads its configuration.
        depends_on:
            app:
                condition: service_healthy
            app-api:
                condition: service_healthy
        ports:
            - "80:80"
            - "443:443"
        # A pinned address (outside the ip_range of the network, so Docker never hands it to another container): app-api
        # trusts X-Forwarded-* from this one address only (TRUSTED_PROXIES). Change together with COMPOSE_SUBNET.
        networks:
            default:
                ipv4_address: ${NGINX_IPV4:-172.28.0.10}
        environment:
            APP_DOMAIN: ${APP_DOMAIN}
            # Picks the /api/ snippet (docker/nginx/snippets/api-fpm.conf | api-octane.conf), the same variable as app-api.
            APP_SERVER: ${APP_SERVER:-fpm}
            # Cloudflare in front (docs/23_CLOUDFLARE_RU.md): PROXY - take the client address from CF-Connecting-IP (only from
            # Cloudflare's ranges); ONLY - port 443 answers 403 to everyone else. Both false = nothing changes.
            CLOUDFLARE_PROXY: ${CLOUDFLARE_PROXY:-false}
            CLOUDFLARE_ONLY: ${CLOUDFLARE_ONLY:-false}
        volumes:
            - ./docker/nginx/prod.conf:/etc/nginx/prod.conf.template:ro
            # Included by prod.conf as they are (not rendered): the way to app-api for each APP_SERVER mode.
            - ./docker/nginx/snippets:/etc/nginx/snippets:ro
            # Fallback list of Cloudflare ranges, used when the entrypoint cannot download the live ones.
            - ./docker/nginx/cloudflare-ips.txt:/etc/nginx/cloudflare-ips.txt:ro
            # Pre-generated audio (/storage/audio/, docs/12 task 1.2c) is served straight from its own volume;
            # the rest of storage (logs, sessions, private files) is deliberately NOT visible to nginx.
            - app_audio:/var/www/html/storage/app/public/audio:ro
            - letsencrypt:/etc/letsencrypt:ro
            - certbot_www:/var/www/certbot:ro
        # The image entrypoint substitutes only APP_DOMAIN and APP_SERVER, generates the Cloudflare files and periodically reloads renewed certificates.

    certbot:
        image: certbot/certbot:latest
        container_name: lexiflow-certbot
        restart: unless-stopped
        volumes:
            - letsencrypt:/etc/letsencrypt
            - certbot_www:/var/www/certbot
        environment:
            APP_DOMAIN: ${APP_DOMAIN}
            CERTBOT_EMAIL: ${CERTBOT_EMAIL}
        # Renew loop: try every 12h; nginx reloads certificates at least every 6h.
        entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

    postgres:
        image: postgres:18-alpine
        container_name: lexiflow-postgres
        restart: unless-stopped
        # Wrapper in front of the official entrypoint (docker/postgres/entrypoint-guard.sh, mounted below): refuses to
        # start 18 when the 16 cluster in `pgdata` ran after the data move (a rollback) - the 18 data would be stale.
        # With `restart: unless-stopped` the container then restarts and refuses again until the owner has decided
        # (upgrade.sh --redo / --keep-current); `app` waits for a healthy postgres and never starts on stale data.
        # `entrypoint:` discards the image's CMD, hence the explicit `command`; run through `sh` so the bind-mounted
        # file needs no execute bit on the host.
        entrypoint: ["/bin/sh", "/usr/local/bin/lexiflow-entrypoint-guard.sh"]
        # idle_in_transaction_session_timeout: a session that sits in an open transaction without sending anything for a
        # minute is closed (the transaction rolled back). Normal paths never idle that long (a request computes between
        # queries for microseconds, pg_dump and the migrations are active, not idle); it is the safety net for a leaked
        # transaction - a hung worker, an operator's psql left in BEGIN - which with pgbouncer would also pin a pooled server
        # connection for good. Set here, on the server, so it holds for every client, pooled or direct.
        # Server tuning (docs/DEVOPS_GUIDE.md §0 «PostgreSQL: настройки под сервер»): the stock settings are made for a
        # laptop (shared_buffers 128MB, random_page_cost 4, JIT on). Defaults here are for the reference 4 vCPU / 8 GB
        # host; every value can be overridden in .env (PG_*), applied with `docker compose up -d postgres`.
        command:
            - postgres
            # idle_in_transaction_session_timeout: see above.
            - -c
            - idle_in_transaction_session_timeout=60s
            # shared_buffers: PostgreSQL's own page cache, ~25% of RAM.
            - -c
            - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
            # effective_cache_size: planner hint only (allocates nothing) - shared_buffers + the OS page cache, ~60% of RAM
            # because Redis x2, php-fpm, pgbouncer and nginx live on the same host.
            - -c
            - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-5GB}
            # work_mem: per sort/hash node of a query; at most ~24 backends (pgbouncer pool + reserve) x a few nodes x 16MB fits.
            - -c
            - work_mem=${PG_WORK_MEM:-16MB}
            # maintenance_work_mem: VACUUM, CREATE INDEX (migrations); a handful of sessions at a time.
            - -c
            - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
            # random_page_cost: 4 is for spinning disks; on SSD an index scan is nearly as cheap as a sequential one.
            - -c
            - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
            # effective_io_concurrency: prefetch depth of bitmap scans on SSD / NVMe.
            - -c
            - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
            # jit: short OLTP queries only pay for JIT planning and compilation.
            - -c
            - jit=${PG_JIT:-off}
            # max_wal_size: fewer forced checkpoints under a write burst (review answers).
            - -c
            - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
            # synchronous_commit: on = a commit is on disk before the client is answered. `off` is the owner's decision
            # (DEVOPS_GUIDE «PostgreSQL: настройки под сервер»): it can lose the last ~0.6 s of commits on a crash.
            - -c
            - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}
            # log_min_duration_statement (ms): statements slower than this go to `docker compose logs postgres`.
            - -c
            - log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT:-500}
        # Docker gives /dev/shm 64MB; parallel query workers of PostgreSQL (dynamic_shared_memory_type=posix) fail with
        # "could not resize shared memory segment" once a plan needs more.
        shm_size: ${PG_SHM_SIZE:-256m}
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            # What the guard tells the operator to run when it refuses, and how to start the stack again afterwards (this
            # container restarts on its own: restart: unless-stopped).
            LEXIFLOW_UPGRADE_CMD: bash docker/postgres/upgrade.sh --prod
            LEXIFLOW_UP_CMD: bash deploy.sh <sha>   (postgres restarts on its own)
        volumes:
            # 18+ images keep the cluster in /var/lib/postgresql/<major>/docker: one mount at /var/lib/postgresql,
            # the volume name carries no version. Data of the ≤16 stack lives in the old volume `pgdata`
            # (mounted at /var/lib/postgresql/data); deploy.sh refuses to start until `make prod-pg-upgrade`
            # has moved it here (docs/DEVOPS_GUIDE.md §0, «Обновление PostgreSQL 16 → 18 (Docker)»).
            - postgresql:/var/lib/postgresql
            # Guard: the old volume stays mounted read-only where the 18+ entrypoint looks for unmigrated clusters
            # (/var/lib/postgresql/*/docker). While it still holds a 16 cluster and the 18 cluster does not exist,
            # the container refuses to initialise an empty database (downtime, never an empty DB), whatever
            # starts it - an old deploy.sh, a plain `docker compose up -d`. An empty or absent old volume is harmless.
            - pgdata:/var/lib/postgresql/16/docker:ro
            - ./docker/postgres/entrypoint-guard.sh:/usr/local/bin/lexiflow-entrypoint-guard.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Connection pooler in front of postgres (docs/DEVOPS_GUIDE.md §0 «pgbouncer и постоянные соединения»). Transaction
    # mode: a server connection serves a client only for the length of a transaction, so the 18 php-fpm workers (app 6 +
    # app-api 12) + the queue workers share PGBOUNCER_POOL_SIZE (20) + PGBOUNCER_RESERVE_POOL_SIZE (4) PostgreSQL backends - well inside
    # max_connections = 100 - and the persistent client connections cost PostgreSQL nothing while they idle. It listens on
    # 5432 like postgres, so switching the application is DB_HOST alone. The auth file is written at start from DB_USERNAME /
    # DB_PASSWORD (mode 0600, never in the image); the password is in the container environment as it is for `postgres`.
    # Console: docker compose exec pgbouncer psql -h 127.0.0.1 -U $DB_USERNAME pgbouncer -c 'SHOW POOLS'.
    pgbouncer:
        build:
            context: .
            dockerfile: Dockerfile
            target: pgbouncer
        image: lexiflow/pgbouncer:${IMAGE_TAG:-latest}
        container_name: lexiflow-pgbouncer
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            PGBOUNCER_DB_HOST: postgres
            PGBOUNCER_DB_PORT: "5432"
            PGBOUNCER_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
            PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-4}
            PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
            PGBOUNCER_QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-30}
        healthcheck:
            # pg_isready through pgbouncer: it answers the startup packet with an authentication request, which is "accepting
            # connections" - pgbouncer is up and routes the database. PGPASSWORD is not needed for that.
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Two Redis instances (docs/19_REDIS_CACHE_PLAN.md §4):
    #   redis       - queues, sessions, locks, rate limits, markers, the entitlement version keys: `noeviction` + AOF,
    #                 nothing here may ever be dropped by memory pressure;
    #   redis-cache - the pure cache (store `lru`): `volatile-lru`, no persistence - a lost key is recomputed.
    # Exact image tag on purpose (not the floating redis:8-alpine): the image is reproducible and the next upgrade is a
    # decision, not an accident. 8.10 writes RDB format 15: a `redisdata` volume written by it does not start on 8.4 again.
    # Both passwords are mandatory here (`:?` - compose refuses to start without them; the words `null`, `(null)`, `empty`
    # and `(empty)` in any case of letters - what older .env files say - are refused by the container itself with a message
    # in its log, because Laravel's env() would read them as "no password" and send no AUTH; deploy.sh refuses them before
    # anything is started, so the stack never comes up half). A password reaches redis-server as a config line on stdin, not as
    # a command line argument, and the healthcheck authenticates through REDISCLI_AUTH; it remains readable in the
    # container environment (`docker inspect`) - see docs/DEVOPS_GUIDE.md, "Redis".
    redis:
        image: redis:8.10-alpine
        container_name: lexiflow-redis
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production - set it in .env (openssl rand -hex 32)}
        command:
            - sh
            - -c
            - |
              case "$$(printf '%s' "$$REDIS_PASSWORD" | tr '[:upper:]' '[:lower:]')" in ''|null|'(null)'|empty|'(empty)')
                  echo "redis: REDIS_PASSWORD is empty or the word null/empty in .env - set a real password: openssl rand -hex 32" >&2
                  exit 1 ;;
              esac
              exec redis-server - --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction <<EOF
              requirepass $$REDIS_PASSWORD
              EOF
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis-cache:
        image: redis:8.10-alpine
        container_name: lexiflow-redis-cache
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD is required in production - set it in .env (openssl rand -hex 32)}
        # No AOF, no RDB: the cache starts empty after a restart, which is the point. Only keys with a TTL are evicted
        # (every pure-cache key has one, docs/19 §3 rule 4). Size: REDIS_CACHE_MAXMEMORY, tuned by the INFO metrics (C8).
        command:
            - sh
            - -c
            - |
              case "$$(printf '%s' "$$REDIS_PASSWORD" | tr '[:upper:]' '[:lower:]')" in ''|null|'(null)'|empty|'(empty)')
                  echo "redis-cache: REDIS_CACHE_PASSWORD is empty or the word null/empty in .env - set a real password: openssl rand -hex 32" >&2
                  exit 1 ;;
              esac
              exec redis-server - --appendonly no --save "" --maxmemory ${REDIS_CACHE_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru <<EOF
              requirepass $$REDIS_PASSWORD
              EOF
        healthcheck:
            test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            interval: 10s
            timeout: 5s
            retries: 5

# The compose network gets a fixed subnet and a pinned address for nginx: in Octane mode app-api trusts the X-Forwarded-* of
# that ONE address (TRUSTED_PROXIES, see app-api). Docker would otherwise pick a subnet at every `down`/`up`.
# `ip_range` is where Docker hands out addresses to containers (172.28.1.0/24); the pinned nginx address (172.28.0.10) and the
# gateway (172.28.0.1) lie outside it, so they can never collide. If the subnet overlaps a network of the host, change
# COMPOSE_SUBNET, COMPOSE_IP_RANGE and NGINX_IPV4 together in .env (all three inside one subnet, NGINX_IPV4 outside the range),
# then `down` and `up -d` (deploy.sh does the `down` itself when it sees the subnet change). Never use a /16 as TRUSTED_PROXIES.
networks:
    default:
        ipam:
            config:
                - subnet: ${COMPOSE_SUBNET:-172.28.0.0/16}
                  ip_range: ${COMPOSE_IP_RANGE:-172.28.1.0/24}

volumes:
    postgresql:
    # ≤16 data (rollback copy), mounted read-only into postgres as a guard; nothing writes it. Removed in a later release.
    pgdata:
    redisdata:
    app_storage:
    app_audio:
    letsencrypt:
    certbot_www:
