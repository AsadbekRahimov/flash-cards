name: CI

on:
    push:
        branches: [master, main, develop, "claude/**"]
    pull_request:
        branches: [master, main, develop]

# The default token is read-only; no job writes to the repository, packages or pull requests (deploy goes over SSH).
permissions:
    contents: read

jobs:
    quality:
        name: Lint & Static analysis
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, bcmath, pdo_pgsql, redis, zip, gd, pcntl
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Audit Composer dependencies
              run: composer audit --no-interaction

            - name: Pint (code style)
              # Runs even when `composer audit` fails, so a new advisory does not hide style/type errors.
              if: ${{ !cancelled() }}
              run: ./vendor/bin/pint --test

            - name: PHPStan (larastan)
              # Runs even when `composer audit` fails, so a new advisory does not hide style/type errors.
              if: ${{ !cancelled() }}
              run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    test:
        name: Pest
        runs-on: ubuntu-latest
        # The suite takes 24-51 min on PostgreSQL (the runners differ); a hung test (a forked race worker that never returns) must
        # fail the job with its log instead of holding the runner for GitHub's default 6 hours.
        timeout-minutes: 90
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_DB: lexiflow
                    POSTGRES_USER: lexiflow
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U lexiflow"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

            redis:
                # The exact tag of docker-compose*.yml: the tests run on the version production runs.
                image: redis:8.10-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

            redis-cache:
                # The second instance of docker-compose*.yml (the pure cache store `lru`, docs/19 §4): a separate server,
                # not another database of the first one, so a test that flushes the pure cache cannot touch the limits,
                # markers and locks of the first - the same isolation the stack has. GitHub's service containers take no
                # command, so the eviction policy itself is not under test here.
                image: redis:8.10-alpine
                ports:
                    - 6380:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: lexiflow
            DB_USERNAME: lexiflow
            DB_PASSWORD: secret
            REDIS_HOST: 127.0.0.1
            REDIS_PORT: 6379
            REDIS_LRU_HOST: 127.0.0.1
            REDIS_LRU_PORT: 6380
            CACHE_STORE: redis
            CACHE_LIMITER_STORE: redis
            CACHE_PURE_STORE: lru
            QUEUE_CONNECTION: sync
            SESSION_DRIVER: array

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, bcmath, pdo_pgsql, redis, zip, gd, pcntl
                  coverage: none
                  tools: composer:v2

            - name: Check PHP extensions of the concurrency tests
              # Those tests skip themselves when pcntl/posix are missing: a lost extension must fail CI, not hide them.
              run: |
                  for ext in pcntl posix; do
                      php -m | grep -qix "$ext" || { echo "missing PHP extension: $ext" >&2; exit 1; }
                  done

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare .env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run migrations
              run: php artisan migrate --force

            - name: Run Pest
              run: ./vendor/bin/pest

    build:
        name: Build assets
        runs-on: ubuntu-latest
        needs: [quality, test]
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      resources/twa/package-lock.json

            - name: Install root frontend dependencies
              run: npm ci

            - name: Audit root frontend dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Audit root frontend dev dependencies
              # Separate from the prod audit above: fails on high/critical in build tooling too.
              run: npm audit --audit-level=high

            - name: Build Laravel assets
              run: npm run build

            - name: Install TWA dependencies
              run: npm ci --prefix resources/twa

            - name: Audit TWA dependencies
              run: npm audit --prefix resources/twa --omit=dev --audit-level=high

            - name: Audit TWA dev dependencies
              run: npm audit --prefix resources/twa --audit-level=high

            - name: Test TWA
              run: npm test --prefix resources/twa

            - name: Build TWA assets
              run: npm run build --prefix resources/twa

            - name: Build production Docker targets
              run: |
                  docker build --target app --tag lexiflow/app:ci .
                  docker build --target app-octane --tag lexiflow/app-octane:ci .
                  docker build --target nginx --tag lexiflow/nginx:ci .
                  docker build --target pgbouncer --tag lexiflow/pgbouncer:ci .

            - name: Smoke the Octane image (api surface, /up)
              # The app-octane stage must start and answer, not only build: the entrypoint caches config/routes/events in
              # production (no database or Redis needed for that nor for /up), FrankenPHP starts the workers. Same
              # variables as phpunit.xml for what the application demands at boot (APP_KEY, bot token, JWT secret).
              run: |
                  SMOKE_ENV="-e APP_ENV=production -e APP_KEY=base64:6rTr6BRIarODejQZcX5sJEhDjwcX3BsTKQKxD3zghK4= -e APP_SURFACE=api
                      -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/smoke.sqlite -e CACHE_STORE=array -e CACHE_LIMITER_STORE=array
                      -e CACHE_PURE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync -e LOG_CHANNEL=stderr
                      -e TELEGRAM_BOT_TOKEN=test-bot-token-1234567890 -e TWA_JWT_SECRET=test-jwt-secret-at-least-32-chars-long-abcdef
                      -e OCTANE_WORKERS=2 -e OCTANE_HTTPS=true"
                  # The image carries the api surface only: no panel routes, the TWA ones present.
                  docker run --rm $SMOKE_ENV lexiflow/app-octane:ci sh -c 'php artisan route:list --json | php docker/check-api-surface.php'
                  docker run -d --name octane-smoke -p 8000:8000 $SMOKE_ENV lexiflow/app-octane:ci
                  ok=0
                  for _ in $(seq 1 60); do
                      if curl -fsS http://127.0.0.1:8000/up > /dev/null 2>&1; then ok=1; break; fi
                      sleep 1
                  done
                  if [ "$ok" -ne 1 ]; then
                      docker logs octane-smoke
                      docker rm -f octane-smoke
                      echo "The Octane image did not answer /up within 60 s" >&2
                      exit 1
                  fi
                  docker rm -f octane-smoke

            - name: Build dev Docker image
              # Dockerfile.dev is what `docker compose up` builds locally (docker-compose.override.yml): it must not rot unnoticed.
              run: docker build -f Dockerfile.dev --tag lexiflow/app:ci-dev .

            - name: Upload Laravel build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: laravel-build
                  path: public/build/
                  retention-days: 7

            - name: Upload TWA build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: twa-build
                  path: public/twa/
                  retention-days: 7

    postgres-upgrade:
        name: PostgreSQL 16 → 18 move (real Docker)
        # docker/postgres/upgrade.sh on the runner's Docker: 16 data in the legacy volume, the guard mount, the move, an
        # interrupted run, a rollback to 16 and forward again, a fresh install, the deploy lock. Official images only,
        # the application services are busybox stand-ins; nothing is built. See docker/postgres/tests/run.sh.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - name: Run the upgrade scenarios
              run: bash docker/postgres/tests/run.sh

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        # The deploy runs upgrade.sh --check on the server: it must not go out before the move scenarios passed on real Docker.
        needs: [build, postgres-upgrade]
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        environment: LexiFlow
        # Two quick merges must not deploy at the same time; the second waits instead of cancelling the first.
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        steps:
            # No server yet (owner's decision 03.11.2026): with none of the three secrets set the deploy is skipped with a
            # warning instead of failing master on every merge. A partial set is a misconfiguration and fails.
            - name: Check the deploy secrets
              id: target
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
              run: |
                  count=0
                  for value in "$SSH_HOST" "$SSH_USER" "$SSH_PRIVATE_KEY"; do
                      if [ -n "$value" ]; then count=$((count + 1)); fi
                  done
                  if [ "$count" -eq 3 ]; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  elif [ "$count" -eq 0 ]; then
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                      echo "::warning title=Deploy skipped::No SSH_HOST, SSH_USER or SSH_PRIVATE_KEY secret in the LexiFlow environment: there is no server to deploy to yet (docs/DEVOPS_GUIDE.md §0)."
                  else
                      echo "::error title=Deploy secrets incomplete::Only $count of SSH_HOST, SSH_USER, SSH_PRIVATE_KEY are set in the LexiFlow environment: set all three or none."
                      exit 1
                  fi
            - name: Deploy via SSH
              if: steps.target.outputs.ready == 'true'
              env:
                  DEPLOY_SHA: ${{ github.sha }}
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  # Deploy exactly the commit that passed CI, not whatever master points to by now.
                  envs: DEPLOY_SHA
                  # Run the deploy.sh OF THAT COMMIT, not the one of the current checkout: bash keeps reading the
                  # file it opened, so `git checkout` inside the script cannot swap in the new version (its new
                  # safety checks would be skipped on exactly the deploy that needs them).
                  script: |
                      set -euo pipefail
                      cd /var/www/lexiflow
                      git fetch origin
                      tmp="$(mktemp)"
                      git show "${DEPLOY_SHA}:deploy.sh" > "$tmp"
                      rc=0
                      bash "$tmp" "$DEPLOY_SHA" || rc=$?
                      rm -f "$tmp"
                      exit "$rc"
