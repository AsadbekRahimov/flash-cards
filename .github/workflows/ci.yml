name: CI

on:
    push:
        branches: [master, main, develop, "claude/**"]
    pull_request:
        branches: [master, main, develop]

jobs:
    quality:
        name: Lint & Static analysis
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, bcmath, pdo_pgsql, redis, zip, gd, pcntl
                  coverage: none
                  tools: composer:v2

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Audit Composer dependencies
              run: composer audit --no-interaction

            - name: Pint (code style)
              # Runs even when `composer audit` fails, so a new advisory does not hide style/type errors.
              if: ${{ !cancelled() }}
              run: ./vendor/bin/pint --test

            - name: PHPStan (larastan)
              # Runs even when `composer audit` fails, so a new advisory does not hide style/type errors.
              if: ${{ !cancelled() }}
              run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    test:
        name: Pest
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_DB: lexiflow
                    POSTGRES_USER: lexiflow
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U lexiflow"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

            redis:
                image: redis:8-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: lexiflow
            DB_USERNAME: lexiflow
            DB_PASSWORD: secret
            REDIS_HOST: 127.0.0.1
            REDIS_PORT: 6379
            CACHE_STORE: redis
            QUEUE_CONNECTION: sync
            SESSION_DRIVER: array

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, bcmath, pdo_pgsql, redis, zip, gd, pcntl
                  coverage: none
                  tools: composer:v2

            - name: Check PHP extensions of the concurrency tests
              # Those tests skip themselves when pcntl/posix are missing: a lost extension must fail CI, not hide them.
              run: |
                  for ext in pcntl posix; do
                      php -m | grep -qix "$ext" || { echo "missing PHP extension: $ext" >&2; exit 1; }
                  done

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare .env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run migrations
              run: php artisan migrate --force

            - name: Run Pest
              run: ./vendor/bin/pest

    build:
        name: Build assets
        runs-on: ubuntu-latest
        needs: [quality, test]
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  # 24, not 26: the TWA tests (vitest + happy-dom) fail on the built-in localStorage of Node 25+.
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      resources/twa/package-lock.json

            - name: Install root frontend dependencies
              run: npm ci

            - name: Audit root frontend dependencies
              run: npm audit --omit=dev --audit-level=high

            - name: Audit root frontend dev dependencies
              # Separate from the prod audit above: fails on high/critical in build tooling too.
              run: npm audit --audit-level=high

            - name: Build Laravel assets
              run: npm run build

            - name: Install TWA dependencies
              run: npm ci --prefix resources/twa

            - name: Audit TWA dependencies
              run: npm audit --prefix resources/twa --omit=dev --audit-level=high

            - name: Audit TWA dev dependencies
              run: npm audit --prefix resources/twa --audit-level=high

            - name: Test TWA
              run: npm test --prefix resources/twa

            - name: Build TWA assets
              run: npm run build --prefix resources/twa

            - name: Build production Docker targets
              run: |
                  docker build --target app --tag lexiflow/app:ci .
                  docker build --target nginx --tag lexiflow/nginx:ci .

            - name: Build dev Docker image
              # Dockerfile.dev is what `docker compose up` builds locally (docker-compose.override.yml): it must not rot unnoticed.
              run: docker build -f Dockerfile.dev --tag lexiflow/app:ci-dev .

            - name: Upload Laravel build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: laravel-build
                  path: public/build/
                  retention-days: 7

            - name: Upload TWA build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: twa-build
                  path: public/twa/
                  retention-days: 7

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        environment: LexiFlow
        # Two quick merges must not deploy at the same time; the second waits instead of cancelling the first.
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        steps:
            - name: Deploy via SSH
              env:
                  DEPLOY_SHA: ${{ github.sha }}
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  # Deploy exactly the commit that passed CI, not whatever master points to by now.
                  envs: DEPLOY_SHA
                  script: cd /var/www/lexiflow && bash deploy.sh "$DEPLOY_SHA"
